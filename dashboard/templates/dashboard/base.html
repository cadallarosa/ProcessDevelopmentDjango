<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %}</title>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Bootstrap (optional, for additional styling) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'dashboard/css/sidebar.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Sidebar Toggle Button (fixed position) -->
    <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" title="Toggle Sidebar">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar Navigation -->
    {% include 'dashboard/partials/sidebar.html' %}

    <!-- Loading Indicator -->
    <div id="loading-indicator" class="htmx-indicator">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Main Content Area -->
    <div id="main-content" class="main-content">
        {% block content %}
        <div class="container-fluid">
            <h1>Welcome to the Dashboard</h1>
            <p>Select an option from the sidebar to get started.</p>
        </div>
        {% endblock %}
    </div>

    <!-- CSRF Token for HTMX -->
    <script>
        const csrfToken = '{{ csrf_token }}';
        
        // Add CSRF token to all HTMX requests
        document.body.addEventListener('htmx:configRequest', function(event) {
            event.detail.headers['X-CSRFToken'] = csrfToken;
        });
    </script>

    <!-- Bootstrap JS (required for modals, dropdowns, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="{% static 'dashboard/js/sidebar.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
